<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI Journey Studio</title>
<style>body{font:16px system-ui;background:#101822;color:#e4edf6;margin:40px auto;max-width:1100px;padding:0 20px}h1{font-size:38px}button,input,textarea{padding:12px;border-radius:8px;border:1px solid #58718b;background:#1e3042;color:white;margin:6px}section{background:#182536;padding:22px;margin:16px 0;border-radius:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#a6bdcf}</style>
<h1>AI Journey Studio</h1><p>Real sources. Durable agents. Your final approval.</p><input id="token" type="password" placeholder="Temporary local access token"><button id="connect">Connect</button><p id="error"></p>
<section><h2>Cleared source capsule</h2><textarea id="source" rows="5" style="width:95%">I am a non-coder. I mainly focus on building AI agents and keep final approval with me. I am confident in client communication and depend on Codex and agents for implementation. I learn by doing. I want to share practical agent-building methods, confidence and honest lessons.</textarea><p>User-reported notes · 9 October 2026 · No proven outcomes</p><button id="add">Save this cleared source</button></section>
<section><h2>Runtime & budget</h2><pre id="runtime">Connect to view actual state.</pre></section><div id="tasks"></div><section><h2>Execution events</h2><pre id="events">No state loaded.</pre></section>
<script>
let access=''; async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+access,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.json()).error);return r.json()}
function el(tag,text,parent){let e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
async function refresh(){try{let s=await api('state');document.getElementById('error').textContent='';document.getElementById('runtime').textContent=JSON.stringify({live_enabled:s.live_enabled,analyst:s.analyst,budget:s.budget,updated:s.updated},null,2);let root=document.getElementById('tasks');root.replaceChildren();if(!s.tasks.length)el('p','No tasks yet. No generated content or usage exists.',root);
for(let source of s.sources){let b=el('button','Queue source '+source.id,root);b.onclick=async()=>{await api('run',{source:source.id});refresh()}}
for(let t of s.tasks){let card=el('section','',root);el('h2','Task '+t.id+' · '+t.status,card);el('small','Updated '+t.updated+' · Source '+t.source,card);let outputs=s.outputs.filter(o=>o.task===t.id);for(let o of outputs){el('h3',o.role,card);el('pre',o.text,card);el('small','Version SHA-256 '+o.hash,card)}let cancel=el('button','Cancel task',card);cancel.onclick=async()=>{await api('cancel',{task:t.id});refresh()};if(t.status==='review'){let b=el('button','Approve these exact versions',card);b.onclick=async()=>{let raw=outputs.map(o=>o.hash).join('|');let bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));let version=Array.from(new Uint8Array(bytes)).map(x=>x.toString(16).padStart(2,'0')).join('');await api('approve',{task:t.id,version});refresh()}}}
document.getElementById('events').textContent=s.events.length?s.events.map(e=>e.created+' · Task '+e.task+' · '+e.kind+' · '+e.detail).join('\n'):'No execution events.'}catch(e){document.getElementById('error').textContent=e.message}}
document.getElementById('connect').onclick=()=>{access=document.getElementById('token').value;refresh()};document.getElementById('add').onclick=async()=>{try{await api('source',{text:document.getElementById('source').value,category:'user-reported-notes',reported_date:'2026-10-09'});refresh()}catch(e){document.getElementById('error').textContent=e.message}};setInterval(()=>{if(access)refresh()},5000)
</script></html>
